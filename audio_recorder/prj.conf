# SPDX-License-Identifier: Apache-2.0
# XIAO nRF54L15 - Audio recorder to SD card (hardware SPI)

# Console / logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO (button, LED)
CONFIG_GPIO=y

# Buses / drivers
CONFIG_SPI=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# SD card stack
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
# More retries/tolerance for marginal cards/wiring
CONFIG_SD_RETRY_COUNT=20
CONFIG_SD_CMD_RETRIES=10
CONFIG_SD_DATA_RETRIES=10

# ADC (battery voltage reading)
CONFIG_ADC=y

# FAT filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks / heap
CONFIG_MAIN_STACK_SIZE=32000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_IDLE_STACK_SIZE=8192
