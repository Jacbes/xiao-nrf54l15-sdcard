# SPDX-License-Identifier: Apache-2.0
# XIAO nRF54L15 - Audio recorder to SD card (hardware SPI)

# Console / logging — use PRINTK only (no deferred log buffer)
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=n
CONFIG_RING_BUFFER_LARGE=y

# GPIO (button, LED)
CONFIG_GPIO=y

# Buses / drivers
CONFIG_SPI=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# SD card stack
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
# Keep timeouts/retries SHORT: on a stuck card a single fs_write would otherwise
# block for DATA_TIMEOUT*DATA_RETRIES (e.g. 30s*20 = 10 min). With these values
# a failed op aborts in a few seconds so the recorder can recover / resume fast.
CONFIG_SD_RETRY_COUNT=5
CONFIG_SD_CMD_RETRIES=3
CONFIG_SD_DATA_RETRIES=3
CONFIG_SD_DATA_TIMEOUT=2000
CONFIG_SD_CMD_TIMEOUT=300

# ADC (battery voltage reading)
CONFIG_ADC=y

# Hardware watchdog (reboot on hang)
CONFIG_WATCHDOG=y

# Reset-cause reporting (hwinfo)
CONFIG_HWINFO=y

# FAT filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks / heap
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_IDLE_STACK_SIZE=4096
