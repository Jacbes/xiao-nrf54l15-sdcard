# SPDX-License-Identifier: Apache-2.0
# XIAO nRF54L15 - Audio recorder (DEFAULT: USB / DEBUG)
# Logs via UART (COM6) and serial terminal

# UART console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Logging via UART
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_RING_BUFFER_LARGE=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_ADC=y

# SD card
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SD_RETRY_COUNT=5
CONFIG_SD_CMD_RETRIES=3
CONFIG_SD_DATA_RETRIES=3
CONFIG_SD_DATA_TIMEOUT=2000
CONFIG_SD_CMD_TIMEOUT=300

CONFIG_WATCHDOG=y
CONFIG_POWEROFF=y

# FAT
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048
