# SPDX-License-Identifier: Apache-2.0
# XIAO nRF54L15 - Audio recorder (DEFAULT: USB / DEBUG)
# Logs via UART (COM6) and serial terminal

# UART console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Disable RTT (UART mode)
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
# Logging via UART
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_RING_BUFFER_LARGE=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_ADC=y

# SD card
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SD_RETRY_COUNT=5
CONFIG_SD_CMD_RETRIES=3
CONFIG_SD_DATA_RETRIES=3
CONFIG_SD_DATA_TIMEOUT=2000
CONFIG_SD_CMD_TIMEOUT=300

CONFIG_WATCHDOG=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# FAT
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_IDLE_STACK_SIZE=2048

# Power down unused RAM blocks in System-ON idle (lowers idle current).
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_DEVICE_NAME="AudioRec"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
# Fixed application passkey (123456) for pairing. The app_passkey()
# callback provides it; the phone prompts the user to enter it.
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=100
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
