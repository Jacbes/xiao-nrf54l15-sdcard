# XIAO nRF54L15 - Audio recorder (BATTERY / PRODUCTION)
# Overlay: west build ... -- -DOVERLAY_CONFIG="prj_battery.conf"
# UART disabled: required for boot from 3.7V LiPo on HW rev v1.0
# printf output via RTT only (J-Link / CMSIS-DAP RTT Viewer)

# RTT console (no UART). Note: LOG subsystem is fully off (see below),
# so RTT here is only for printk/printf, not for the LOG API.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Disable UART completely (saves ~170 uA idle + flash)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n

# Disable the LOG subsystem entirely for production (saves flash).
# Must be off so its RTT/UART backends are not pulled in. Explicitly
# disable the backends too so the base prj.conf (LOG=y) assignments do
# not raise unsatisfied-dependency warnings.
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_CONSOLE_SUBSYS=n

# Power down unused RAM blocks in System-ON idle.
# (Main DCDC regulator is already enabled via the board DT vregmain node.)
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# System OFF wake support
CONFIG_HWINFO=y
