# XIAO nRF54L15 - Audio recorder (USB / DEBUG MODE)
# Overlay: west build ... -- -DOVERLAY_CONFIG="prj_uart.conf"
# Enables UART console for serial logs via USB-C

# UART console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Disable RTT (UART mode)
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

# Logging via UART
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# System OFF wake support
CONFIG_HWINFO=y
