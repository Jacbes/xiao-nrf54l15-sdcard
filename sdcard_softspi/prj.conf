# SPDX-License-Identifier: Apache-2.0
# XIAO nRF54L15 - SD card (SPI) full self-test

# Console / logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
# Synchronous logging so no informational lines get dropped during the fast
# boot burst (bit-bang SD init queues several driver log messages).
CONFIG_LOG_MODE_IMMEDIATE=y

# Buses / drivers
CONFIG_GPIO=y
CONFIG_SPI=y
# Software (bit-bang) SPI: needed to clock the SD card at <=400 kHz for init
# (hardware SPIM00 on these pins cannot go below 2 MHz).
CONFIG_SPI_BITBANG=y

# SD card stack: SDHC (SPI) -> SDMMC disk -> disk access
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# FAT filesystem (ELM FatFs) with long-file-name support
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks / heap sized generously for FatFs + SDHC (they are stack hungry)
CONFIG_MAIN_STACK_SIZE=32000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_IDLE_STACK_SIZE=8192

# Keep the SoC at constant latency for reliable SPI timing during init
CONFIG_SOC_NRF_FORCE_CONSTLAT=y
