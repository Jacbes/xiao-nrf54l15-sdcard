# XIAO nRF54L15 - SD card over HARDWARE SPI (SPIM21)

# Console / logging (stays on UART20 -> on-board USB-serial / COM port)
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Buses / drivers
CONFIG_GPIO=y
CONFIG_SPI=y

# SD card stack: SDHC (SPI) -> SDMMC disk -> disk access
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# FAT filesystem (ELM FatFs) with long-file-name support
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# Stacks / heap sized generously for FatFs + SDHC
CONFIG_MAIN_STACK_SIZE=32000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_IDLE_STACK_SIZE=8192
